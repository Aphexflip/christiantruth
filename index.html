<script>
const storageKey = 'christiantruth_ai_claims';

let claims = [];
let visibleCount = 8;
let scrollLock = false;

/* ===== PREPROCESS ===== */
function preprocessClaims(claims) {
  const seen = new Map();

  return claims.map(c => {
    const key = c.claim.toLowerCase().trim();
    if (seen.has(key)) return null;
    seen.set(key, true);

    return {
      ...c,
      category: c.category.toLowerCase(),
      searchBlob: [
        c.claim,
        c.shortResponse,
        c.fullResponse,
        ...(c.tags || []),
        ...(c.aliases || [])
      ].join(' ').toLowerCase()
    };
  }).filter(Boolean);
}

/* ===== QUERY EXPANSION ===== */
function expandQuery(query) {
  const map = {
    prayer: ["prayer","pray","praying"],
    god: ["god","deity","creator"],
    bible: ["bible","scripture"],
    evolution: ["evolution","darwin"],
    miracle: ["miracle","supernatural"]
  };

  let expanded = [query];

  for (const key in map) {
    if (query.includes(key)) expanded = expanded.concat(map[key]);
  }

  return expanded.join(' ');
}

/* ===== SCORE ===== */
function scoreClaim(item, query) {
  if (!query) return 0;

  let score = 0;

  if (item.searchBlob.includes(query)) score += 100;

  const tokens = query.split(/\s+/);
  for (const token of tokens) {
    if (item.searchBlob.includes(token)) score += 10;
  }

  if (item.claim.toLowerCase().includes(query)) score += 50;

  return score;
}

/* ===== INIT ===== */
async function init() {
  const response = await fetch('./claims.json');
  const data = await response.json();

  claims = preprocessClaims(data);
  render();
}

init();
</script>
