<script>
const storageKey = 'christiantruth_ai_claims';

/* =========================
   🔥 NEW: PREPROCESS ENGINE
========================= */
function preprocessClaims(claims) {
  const seen = new Map();

  return claims.map(c => {
    const key = c.claim.toLowerCase().trim();

    if (seen.has(key)) return null;
    seen.set(key, true);

    return {
      ...c,
      category: c.category.toLowerCase(),
      searchBlob: [
        c.claim,
        c.shortResponse,
        c.fullResponse,
        ...(c.tags || []),
        ...(c.aliases || [])
      ].join(' ').toLowerCase()
    };
  }).filter(Boolean);
}

/* =========================
   🔥 QUERY EXPANSION
========================= */
function expandQuery(query) {
  const map = {
    prayer: ["prayer", "pray", "praying"],
    god: ["god", "creator", "deity"],
    bible: ["bible", "scripture"],
    evolution: ["evolution", "darwin", "natural selection"],
    miracle: ["miracle", "supernatural", "divine"]
  };

  let expanded = [query];

  for (const key in map) {
    if (query.includes(key)) {
      expanded = expanded.concat(map[key]);
    }
  }

  return expanded.join(' ');
}

/* =========================
   🔥 FASTER SCORING
========================= */
function scoreClaim(item, query) {
  if (!query) return 0;

  let score = 0;

  if (item.searchBlob.includes(query)) score += 100;

  const tokens = query.split(/\s+/);
  for (const token of tokens) {
    if (item.searchBlob.includes(token)) score += 10;
  }

  if (item.claim.toLowerCase().includes(query)) score += 50;

  return score;
}

/* =========================
   🔥 FILTER
========================= */
function getFilteredClaims() {
  const allClaims = getAllClaims();
  const rawQuery = searchInput.value.trim().toLowerCase();
  const query = expandQuery(rawQuery);
  const category = categoryFilter.value;

  let filtered = allClaims.filter(item => {
    return category === 'all' || item.category === category;
  });

  if (!query) return filtered;

  return filtered
    .map(item => ({ ...item, _score: scoreClaim(item, query) }))
    .filter(item => item._score > 0)
    .sort((a, b) => b._score - a._score);
}
